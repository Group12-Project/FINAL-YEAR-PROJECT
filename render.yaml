# Render Blueprint for the FaceVector Node.js API.
# Create the MongoDB Atlas database first, then fill the prompted secret values.
services:
  - type: web
    name: facevector-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: ALLOW_TEACHER_SIGNUP
        value: "false"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: TEACHER_JWT_EXPIRES_IN
        value: 30d
