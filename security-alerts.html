<script src="js/theme.js"></script></head><body><div id="nav"></div><main><header><a href="index.html">FaceVector</a><span id="clock"></span><button data-logout>Logout</button></header><h1>Security Alerts</h1><p>Review events, acknowledge incidents and resolve them after an in-person response. Unknown faces are unverified matches and do not imply wrongdoing.</p><button id="notifyPermission">Enable browser notifications</button><p id="notice" role="status" aria-live="polite"></p>
<section class="card"><h2>Report a security incident</h2><form id="alertForm" class="portal-grid"><label>Incident category<input name="category" required maxlength="60" placeholder="e.g. Gate issue"></label><label>Priority<select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></label><label>Location<input name="locationName" maxlength="100" placeholder="e.g. Main entrance"></label><label>Description<textarea name="description" required maxlength="500" rows="3" placeholder="Describe what happened and what needs attention"></textarea></label><button type="submit">Submit security alert</button></form></section>
<section><h2>Recent alerts</h2><div id="alerts" class="portal-grid"></div></section></main><script src="js/main.js"></script><script src="js/config.js"></script><script src="public/app.js"></script><script src="public/security-alerts.js"></script></body></html>
